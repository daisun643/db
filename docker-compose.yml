services:
  oracle-db:
    image: gvenzl/oracle-xe:18-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: OracleSysPass123!
      APP_USER: appuser
      APP_USER_PASSWORD: AppUserPass123!
    ports:
      - "1522:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./database:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s appuser/AppUserPass123!@localhost:1521/XEPDB1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks:
      - app-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Oracle: "User Id=appuser;Password=AppUserPass123!;Data Source=oracle-db:1521/XEPDB1"
    depends_on:
      oracle-db:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./backend:/app/src
    networks:
      - app-network

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-web
    environment:
      VITE_API_BASE_URL: https://localhost:8443
    depends_on:
      - backend-api
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network

  https-proxy:
    image: caddy:2-alpine
    container_name: https-proxy
    depends_on:
      - frontend-web
      - backend-api
    ports:
      - "8443:8443"
      - "8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

volumes:
  oracle_data:
  frontend_node_modules:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
